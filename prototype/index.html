<title>AEP-CLW Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#F7F9F9; --surface-3:#EBF0F0;
  --border:#DCE4E3; --border-strong:#C3D0CF;
  --text:#122322; --text-2:#3B4F4D; --muted:#667977;
  --accent:#0B6B6B; --accent-hover:#085757; --accent-ink:#FFFFFF; --accent-soft:#DCEEED;
  --ok:#157043; --ok-soft:#DDF1E5; --warn:#8A5B00; --warn-soft:#FAEFD3;
  --danger:#B42318; --danger-soft:#FBE3E0; --info:#2D5B88; --info-soft:#E0EBF5;
  --series-1:#0B6B6B; --series-2:#B7791F; --grid:#E3EAE9;
  --device:#0F1717; --device-edge:#2A3535; --phone-bg:#F6F7F7; --phone-card:#FFFFFF;
  --shadow:0 1px 2px rgba(16,40,40,.06),0 6px 20px rgba(16,40,40,.06);
  --shadow-lg:0 10px 40px rgba(10,30,30,.18);
  --focus:#0B6B6B;
  --radius:12px;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1313; --surface:#131C1C; --surface-2:#172222; --surface-3:#1D2A2A;
    --border:#243333; --border-strong:#324545;
    --text:#E3ECEB; --text-2:#B3C3C1; --muted:#849796;
    --accent:#3DB5AD; --accent-hover:#5BC8C0; --accent-ink:#052020; --accent-soft:#12302F;
    --ok:#4DC38A; --ok-soft:#123324; --warn:#E2B24A; --warn-soft:#352B12;
    --danger:#F07368; --danger-soft:#3A1B19; --info:#80B1E0; --info-soft:#172839;
    --series-1:#3DB5AD; --series-2:#E0A84A; --grid:#223030;
    --device:#030707; --device-edge:#1F2A2A; --phone-bg:#0F1616; --phone-card:#182222;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    --focus:#5BC8C0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1313; --surface:#131C1C; --surface-2:#172222; --surface-3:#1D2A2A;
  --border:#243333; --border-strong:#324545;
  --text:#E3ECEB; --text-2:#B3C3C1; --muted:#849796;
  --accent:#3DB5AD; --accent-hover:#5BC8C0; --accent-ink:#052020; --accent-soft:#12302F;
  --ok:#4DC38A; --ok-soft:#123324; --warn:#E2B24A; --warn-soft:#352B12;
  --danger:#F07368; --danger-soft:#3A1B19; --info:#80B1E0; --info-soft:#172839;
  --series-1:#3DB5AD; --series-2:#E0A84A; --grid:#223030;
  --device:#030707; --device-edge:#1F2A2A; --phone-bg:#0F1616; --phone-card:#182222;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  --focus:#5BC8C0;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;overflow-x:hidden}
[hidden]{display:none !important}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.mono{font-family:var(--mono);font-size:.92em}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.brandmark .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.brandmark small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-3);border-radius:10px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;max-width:max-content;margin-inline:auto}
.seg::-webkit-scrollbar{display:none}
.seg button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600;color:var(--text-2);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg button:hover{color:var(--text)}
.theme-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;height:36px;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--text-2);font-weight:600;font-size:12.5px}

.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 48px}
.view-lead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:16px;color:var(--text-2);font-size:13px}
.view-lead strong{color:var(--text)}
.ms{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.ms.m4{background:var(--info-soft);color:var(--info)}
.ms.m5{background:var(--warn-soft);color:var(--warn)}

/* ---------- Common UI ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{font-size:14.5px}
.card-b{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn-ok:hover{background:var(--ok-soft)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.btn-ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.input,.select{height:36px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
.input:focus,.select:focus{outline:2px solid var(--focus);outline-offset:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:10px;color:var(--muted)}
.search .input{padding-left:32px;width:240px;max-width:100%}
.switch{position:relative;width:40px;height:22px;border-radius:999px;border:0;background:var(--border-strong);padding:0;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.grid{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:12px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover td{background:var(--surface-2)}
.tbl tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
.tbl .sub{display:block;font-size:11.5px;color:var(--muted)}
.tbl.wide{min-width:760px}
.tbl.mid{min-width:560px}
.pos-amt{color:var(--ok)}
.neg-amt{color:var(--text)}

/* toast & modal */
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px);width:360px}
.toast{background:var(--text);color:var(--bg);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-lg);font-size:13px;animation:tin .25s ease-out}
.toast .ic{margin-top:1px}
.toast.ok .ic{color:#6EE7A8}.toast.err .ic{color:#FF9A8F}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(6,16,16,.5);display:grid;grid-template-columns:minmax(0,560px);justify-content:center;align-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--border)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:16px}
.modal-b{padding:18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.icon-btn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}

/* ---------- Mobile view ---------- */
.mob-layout{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:24px;align-items:start}
.explain h2{font-size:20px;margin-bottom:8px}
.explain p{color:var(--text-2)}
.explain ul{margin:10px 0 0;padding-left:18px;color:var(--text-2)}
.explain li{margin:6px 0}
.sector-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sector-pick button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);text-align:left;font-weight:600}
.sector-pick button .sw{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.sector-pick button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.sector-pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.try-list{counter-reset:t;list-style:none;padding:0 !important}
.try-list li{counter-increment:t;position:relative;padding-left:30px}
.try-list li::before{content:counter(t);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--text-2);font-size:11px;font-weight:700;display:grid;place-items:center}

.phone{--brand:#7B4B2A;--brand-soft:color-mix(in srgb,var(--brand) 12%,transparent);--brand-deep:color-mix(in srgb,var(--brand) 78%,#000);
  width:390px;max-width:100%;height:780px;border-radius:48px;background:var(--device);padding:11px;box-shadow:0 0 0 1px var(--device-edge),var(--shadow-lg);position:relative}
.phone-screen{height:100%;border-radius:38px;overflow:hidden;background:var(--phone-bg);display:flex;flex-direction:column;position:relative}
.p-notch{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:104px;height:28px;background:var(--device);border-radius:20px;z-index:5}
.p-status{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 30px;font-weight:700;font-size:13.5px}
.p-status .r{display:flex;gap:5px;align-items:center}
.p-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
.p-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px}
.p-logo .lt{width:32px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.p-avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12.5px}
.p-body{flex:1;overflow-y:auto;padding:4px 16px 20px;scrollbar-width:thin}
.p-tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 18px;border-top:1px solid var(--border);background:var(--phone-card)}
.p-tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 0}
.p-tabs button[aria-current="page"]{color:var(--brand)}
.p-tabs .pay-tab .ic-wrap{width:44px;height:44px;margin-top:-18px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 40%,transparent)}
.p-card{background:var(--phone-card);border-radius:16px;padding:14px;border:1px solid var(--border)}
.p-sec-t{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-weight:700;font-size:14px}
.p-sec-t button{border:0;background:none;color:var(--brand);font-weight:700;font-size:12.5px}
.bal-card{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-deep));position:relative;overflow:hidden}
.bal-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.bal-card .lbl{font-size:12px;opacity:.85;font-weight:600}
.bal-card .amt{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.bal-card .sub{display:flex;gap:18px;font-size:12px}
.bal-card .sub b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums}
.bal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:relative;z-index:1}
.bal-actions button{height:40px;border-radius:12px;border:0;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.bal-actions .b1{background:#fff;color:var(--brand-deep)}
.bal-actions .b2{background:rgba(255,255,255,.18);color:#fff}
.tx-item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border)}
.tx-item:last-child{border-bottom:0}
.tx-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.tx-ic.in{background:var(--ok-soft);color:var(--ok)}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main span{font-size:11.5px;color:var(--muted)}
.tx-amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.tx-amt.in{color:var(--ok)}
.p-btn{width:100%;height:48px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.p-btn:hover{filter:brightness(1.06)}
.p-btn.ghost{background:var(--brand-soft);color:var(--brand)}
.p-btn[disabled]{opacity:.55}
.loy-bar{height:8px;border-radius:999px;background:var(--brand-soft);overflow:hidden;margin:8px 0 6px}
.loy-bar i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.special{border-radius:16px;padding:14px;margin-top:12px;border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);background:var(--brand-soft)}
.special .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px;margin-top:8px}
.kv span{color:var(--muted)}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.sub-wallet{display:flex;align-items:center;gap:10px;padding:10px;background:var(--phone-card);border-radius:12px;margin-top:8px}
.sub-wallet .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.p-title{font-size:20px;font-weight:800;margin:6px 2px 4px}
.p-desc{font-size:12.5px;color:var(--muted);margin:0 2px 14px}
.qr-box{background:#fff;border-radius:20px;padding:18px;display:grid;place-items:center;position:relative;border:1px solid var(--border)}
.qr-box svg{width:220px;height:220px;display:block}
.qr-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;border:4px solid #fff}
.qr-meta{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.ring{position:relative;width:48px;height:48px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.amt-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt-chips button{height:44px;border-radius:12px;border:1px solid var(--border);background:var(--phone-card);font-weight:700;font-variant-numeric:tabular-nums}
.amt-chips button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.amt-big{text-align:center;font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 14px}
.pm{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--phone-card)}
.pm .cardic{width:42px;height:28px;border-radius:6px;background:linear-gradient(135deg,#2B3A3A,#101818);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.04em}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:14px;background:var(--phone-card);border:1px solid var(--border)}
.setting-row small{display:block;color:var(--muted);font-size:11.5px}
.phone .switch[aria-checked="true"]{background:var(--brand)}
.success{text-align:center;padding:36px 8px 12px}

/* =========================================================
   Toast & Modal
   ========================================================= */
function toast(msg, kind = 'ok'){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = icon(kind === 'err' ? 'alert' : kind === 'info' ? 'info' : 'checkc', 18) + `<div>${msg}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
let modalCtx = null;
function openModal({title, body, actions = [], ctx = null}){
  modalCtx = ctx;
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = actions.map(a => `<button class="btn ${a.cls || ''}" data-act="${a.act}" ${a.arg ? `data-arg="${a.arg}"` : ''}>${a.label}</button>`).join('');
  $('#modalBg').hidden = false;
  const f = $('#modalBody input, #modalBody select, #modalBody button') || $('#modalFoot .btn:last-child');
  f && f.focus();
}
function closeModal(){ $('#modalBg').hidden = true; modalCtx = null; }

let theme = 'auto';
function applyTheme(){
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  const lbl = {auto:'Otomatik', light:'Açık', dark:'Koyu'}[theme];
  $('#themeBtn').innerHTML = icon(theme === 'auto' ? 'auto' : theme === 'light' ? 'sun' : 'moon', 16) + `<span class="lbl">${lbl}</span>`;

  try { localStorage.setItem('clw-theme', theme); } catch(e) {}
}

function qrSVG(seed){
  const N = 25, r = rng(seed * 7919 + 13);
  const m = Array.from({length:N}, () => Array(N).fill(0));
  const finder = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++){ const e = i === 0 || i === 6 || j === 0 || j === 6, c = i >= 2 && i <= 4 && j >= 2 && j <= 4; m[y + i][x + j] = (e || c) ? 1 : 2; } };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  for (let i = 0; i < 8; i++){ [[7,i],[i,7],[N-8,i],[N-8+ (i<1?0:0), i],[i,N-8],[7,N-1-i],[N-1-i,7]].forEach(([x,y]) => { if (x>=0&&y>=0&&x<N&&y<N && m[y][x] === 0) m[y][x] = 2; }); }
  for (let i = 8; i < N - 8; i++){ m[6][i] = i % 2 ? 2 : 1; m[i][6] = i % 2 ? 2 : 1; }
  // alignment pattern
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++){ const a = Math.max(Math.abs(i), Math.abs(j)); m[18 + i][18 + j] = a === 1 ? 2 : 1; }
  let d = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    if (m[y][x] === 0) m[y][x] = r() > 0.52 ? 1 : 2;
    const inLogo = x >= 10 && x <= 14 && y >= 10 && y <= 14;
    if (m[y][x] === 1 && !inLogo) d += `M${x} ${y}h1v1h-1z`;
  }
  return `<svg viewBox="-1 -1 ${N + 2} ${N + 2}" shape-rendering="crispEdges" role="img" aria-label="Dinamik ödeme QR kodu"><rect x="-1" y="-1" width="${N + 2}" height="${N + 2}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
const qrToken = seed => { const r = rng(seed * 31 + 5); return 'CLW-' + hex(r, 4).toUpperCase() + '-' + hex(r, 4).toUpperCase() + '-' + hex(r, 4).toUpperCase(); };

const CHART = (() => {
  const r = rng(2026), top = [], sp = [], dates = [];
  const M = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  for (let i = 0; i < 30; i++){
    const dt = new Date(2026, 7, 27 + i);
    const wd = dt.getDay(), wk = wd === 0 || wd === 6;
    dates.push(`${dt.getDate()} ${M[dt.getMonth()]}`);
    const trend = 520000 + i * 3200;
    top.push(Math.round(trend + (wk ? 70000 : 0) + (r() - .5) * 60000 + (dt.getDate() === 1 || dt.getDate() === 15 ? 90000 : 0)));
    sp.push(Math.round(trend - 25000 + (wk ? 95000 : 0) + (r() - .5) * 50000));
  }
  top[29] = 642180; sp[29] = 598940;
  return {top, sp, dates};
})();

function chartSVG(){
  const W = 760, H = 280, P = {l:64, r:16, t:14, b:32};
  const iw = W - P.l - P.r, ih = H - P.t - P.b, max = 800000;
  const x = i => P.l + i * iw / 29, y = v => P.t + ih - v / max * ih;
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  let g = '';
  for (let v = 0; v <= max; v += 200000){
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${P.l - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${v ? '₺' + nf(v / 1000) + ' bin' : '₺0'}</text>`;
  }
  let xl = '';
  for (let i = 0; i < 30; i += 5) xl += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${CHART.dates[i]}</text>`;
  xl += `<text x="${x(29)}" y="${H - 10}" text-anchor="end" font-size="11" fill="var(--muted)">${CHART.dates[29]}</text>`;
  const area = path(CHART.top) + `L${x(29)} ${y(0)}L${x(0)} ${y(0)}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 30 gün günlük yükleme ve harcama tutarları grafiği">
    ${g}${xl}
    <path d="${area}" fill="var(--series-1)" opacity=".08"/>
    <path d="${path(CHART.top)}" fill="none" stroke="var(--series-1)" stroke-width="2.25" stroke-linejoin="round"/>
    <path d="${path(CHART.sp)}" fill="none" stroke="var(--series-2)" stroke-width="2.25" stroke-linejoin="round"/>
    <circle cx="${x(29)}" cy="${y(CHART.top[29])}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${x(29)}" cy="${y(CHART.sp[29])}" r="4" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"/>
    <g id="chHover" visibility="hidden"><line id="chLine" y1="${P.t}" y2="${P.t + ih}" stroke="var(--border-strong)" stroke-dasharray="3 3"/><circle id="chD1" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/><circle id="chD2" r="4.5" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2"/></g>
    <rect id="chOverlay" x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
}
function bindChart(){
  const box = $('#chartBox'); if (!box) return;
  const svg = $('svg', box), tip = $('#chartTip');
  const W = 760, P = {l:64, r:16, t:14, b:32}, iw = W - P.l - P.r, ih = 280 - P.t - P.b, max = 800000;
  const move = e => {
    const rect = svg.getBoundingClientRect();
    const sx = (e.clientX - rect.left) / rect.width * W;
    const i = Math.max(0, Math.min(29, Math.round((sx - P.l) / iw * 29)));
    const cx = P.l + i * iw / 29, y = v => P.t + ih - v / max * ih;
    $('#chHover').setAttribute('visibility', 'visible');
    $('#chLine').setAttribute('x1', cx); $('#chLine').setAttribute('x2', cx);
    $('#chD1').setAttribute('cx', cx); $('#chD1').setAttribute('cy', y(CHART.top[i]));
    $('#chD2').setAttribute('cx', cx); $('#chD2').setAttribute('cy', y(CHART.sp[i]));
    tip.hidden = false;
    tip.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${CHART.dates[i]} 2026</div><div class="between"><span><i style="display:inline-block;width:10px;height:3px;background:var(--series-1);margin-right:6px;vertical-align:middle"></i>Yükleme</span><b>${tl0(CHART.top[i])}</b></div><div class="between"><span><i style="display:inline-block;width:10px;height:3px;background:var(--series-2);margin-right:6px;vertical-align:middle"></i>Harcama</span><b>${tl0(CHART.sp[i])}</b></div><div class="between muted"><span>Net akış</span><b>${signed(CHART.top[i] - CHART.sp[i]).replace(',00', '')}</b></div>`;
    const px = cx / W * rect.width, bw = box.clientWidth;
    tip.style.left = Math.min(bw - 180, Math.max(0, px + 12 > bw - 190 ? px - 190 : px + 12)) + 'px';
    tip.style.top = '10px';
  };
  const leave = () => { $('#chHover').setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const ov = $('#chOverlay');
  ov.addEventListener('pointermove', move); ov.addEventListener('pointerleave', leave);
}

const fmtMins = m => `${Math.floor(m / 60)} sa ${String(m % 60).padStart(2, '0')} dk`;
function holdCost(){
  if (pos.holdSector === 'ev') return Math.round(pos.hold.kwh * 8.9 * 100) / 100;

  },
  holdClose:() => {
    const cost = Math.min(holdCost(), pos.hold.amount), ev = pos.holdSector === 'ev';
    pos.last = {title: ev ? 'Şarj oturumu kapatıldı' : 'Otopark çıkışı onaylandı', store: ev ? 'VOLTGO ŞARJ — MASLAK DC-04' : 'PARKPLUS — LEVENT KAPALI', term: ev ? 'T-EV-0412' : 'T-PK-0207', ref:ref(), totalLbl:'TAHSİL EDİLEN', total:tl(cost),
      lines:[[ev ? 'Enerji' : 'Plaka', ev ? nf(pos.hold.kwh, 1) + ' kWh' : '34 ABC 123'], [ev ? 'Birim fiyat' : 'Süre', ev ? '₺8,90 / kWh' : fmtMins(pos.hold.mins)], ['Provizyon', tl(pos.hold.amount)], ['Tahsil (capture)', tl(cost)], ['Serbest bırakılan', tl(pos.hold.amount - cost)]]};
    pos.step = 'receipt'; posRerender(); toast(`Provizyon kapatıldı: ${tl(cost)} tahsil, ${tl(pos.hold.amount - cost)} serbest`);
  },
  posNew:() => { pos.step = pos.mode === 'refund' ? 'select' : 'input'; pos.refSel = null; pos.cents = pos.mode === 'hold' ? (pos.holdSector === 'ev' ? 40000 : 25000) : pos.mode === 'sale' ? 8750 : 0; posRerender(); },

  /* platform */
  wizOpen:() => { plat.wizStep = 1; plat.wiz = {name:'', vkn:'', email:'', plan:'Growth', preset:'coffee', color:'#0B6B6B', app:''}; wizRender(); },
  wizNext:() => {
    wizCapture();
    if (plat.wizStep === 1){
      const w = plat.wiz, err = [];
      if (w.name.length < 3) err.push('unvan');
      if (!/^\d{10}$/.test(w.vkn.replace(/\s/g, ''))) err.push('10 haneli VKN');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(w.email)) err.push('geçerli e-posta');
      if (err.length){ const e = $('#wErr'); e.textContent = 'Lütfen kontrol edin: ' + err.join(', ') + '.'; e.style.color = 'var(--danger)'; return; }
    }
    plat.wizStep++; wizRender();
  },
  wizBack:() => { wizCapture(); plat.wizStep--; wizRender(); },
  wizPreset:(a) => { plat.wiz.preset = a; $('#modalBody').innerHTML = wizBody(); },
  wizColor:(a) => { wizCapture(); plat.wiz.color = a; $('#modalBody').innerHTML = wizBody(); },
  wizFinish:() => {
    wizCapture();
    const w = plat.wiz, nm = w.app || w.name;
    TENANTS.unshift({name:nm, letter:nm[0].toLocaleUpperCase('tr-TR'), color:w.color, sector:PRESETS.find(p => p.k === w.preset).n, plan:w.plan, st:'Kurulum', vol:0, wallets:0, since:'2026'});
    closeModal(); renderPlatform();
    toast(`“${esc(nm)}” oluşturuldu · Keycloak organizasyonu, şema ve varsayılan hesap planı hazırlanıyor. Davet: ${esc(w.email)}`);
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.act];
  if (fn){ e.preventDefault(); fn(t.dataset.arg, t); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modalBg').hidden) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')){ e.preventDefault(); A[e.target.dataset.act](e.target.dataset.arg); }
});
$('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });
document.addEventListener('input', e => {
  if (e.target.id === 'custQ'){ adm.custQ = e.target.value; renderCustRows(); }
  if (e.target.id === 'txQ'){ adm.txQ = e.target.value; renderTxRows(); }
  if (e.target.id === 'wApp'){ plat.wiz.app = e.target.value; const nm = e.target.value || plat.wiz.name || 'Yeni Marka'; const p = $('#wizPrev'); if (p){ $('.lt', p).textContent = nm[0].toLocaleUpperCase('tr-TR'); $('b', p).textContent = nm; } }
});
document.addEventListener('change', e => { if (e.target.id === 'txType'){ adm.txType = e.target.value; renderTxRows(); } });

/* =========================================================
   Global ticker (QR countdown, POS meters, platform health)
   ========================================================= */
let tick = 0;
setInterval(() => {
  tick++;
  if (app.view === 'mobile' && mob.screen === 'pay' && mob.payState === 'qr'){
    mob.qrLeft--;
    if (mob.qrLeft <= 0){ mob.qrSeed++; mob.qrLeft = 30; rerenderBody(); }
    else {
      const l = $('#qrLeft'), ring = $('#qrRing');
      if (l) l.textContent = mob.qrLeft;
      if (ring){ const c = 2 * Math.PI * 20; ring.setAttribute('stroke-dashoffset', c * (1 - mob.qrLeft / 30)); }
    }
  }
  if (app.view === 'pos' && pos.mode === 'hold' && pos.step === 'active'){
    if (pos.holdSector === 'ev') pos.hold.kwh = Math.round((pos.hold.kwh + 0.3) * 10) / 10; else pos.hold.mins += 3;
    const m = $('#holdMeter'), c = $('#holdCost'), b = $('#holdBar'), cost = holdCost();
    if (m) m.textContent = pos.holdSector === 'ev' ? nf(pos.hold.kwh, 1) + ' kWh' : fmtMins(pos.hold.mins);
    if (c) c.textContent = tl(cost);
    if (b) b.style.width = Math.min(100, cost / pos.hold.amount * 100) + '%';
  }
  if (app.view === 'platform' && tick % 3 === 0){
    const r = Math.random;
    SERVICES.forEach(s => { s.p99 = Math.max(8, Math.round(s.p99 * (0.94 + r() * 0.12))); if (s.warn && s.p99 < 450) s.p99 = 450 + Math.round(r() * 250); if (!s.warn && s.p99 > 260) s.p99 = 240; s.rps = Math.max(1, Math.round(s.rps * (0.95 + r() * 0.1))); });
    KAFKA.forEach(k => { k.lag = Math.max(0, Math.round(k.lag * (0.85 + r() * 0.3) + (r() < .3 ? 5 : 0))); if (k.g === 'settlement-batch') k.lag = Math.max(2400, Math.min(4800, k.lag)); });
    const g = $('#svcGrid'), kb = $('#kafkaBox');
    if (g) g.innerHTML = svcTiles();
    if (kb) kb.innerHTML = kafkaRows();
  }
}, 1000);

/* =========================================================
   Boot
   ========================================================= */
try { const t = localStorage.getItem('clw-theme'); if (THEMES.includes(t)) theme = t; } catch(e) {}
$('#modalX').innerHTML = icon('x', 18);
applyTheme();
setView('mobile');
})();
</script>
