name: Hata
description: Hata bildirimi
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: Ne oldu / ne bekleniyordu? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Yeniden üretme adımları }
  - type: dropdown
    id: severity
    attributes: { label: Önem, options: ["Sev1 - kritik (finansal/veri)", "Sev2 - yüksek", "Sev3 - orta", "Sev4 - düşük"] }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Ortam / sürüm }
