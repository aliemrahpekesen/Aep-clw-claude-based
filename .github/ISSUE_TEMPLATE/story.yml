name: Story
description: Kullanıcı hikayesi / iş kalemi
labels: ["type:story"]
body:
  - type: textarea
    id: description
    attributes: { label: Açıklama, description: "Kim olarak, ne istiyorum, neden?" }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Kabul kriterleri, value: "- [ ] " }
    validations: { required: true }
  - type: input
    id: epic
    attributes: { label: Epic, placeholder: "E0x" }
  - type: dropdown
    id: priority
    attributes: { label: Öncelik, options: ["P0", "P1", "P2"] }
